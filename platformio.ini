; PlatformIO Project Configuration — LilyGo T-SIM7000G cellular→WiFi NAT router
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build OUTSIDE the Documents tree (same reason as ambit-IoT): that folder is
; OneDrive-synced / AV-scanned, which breaks fresh creation of .pio/build sub-dirs
; ("opening dependency file ...cpp.d: No such file or directory" on a clean build).
; LOCALAPPDATA is local-only and not auto-cleaned.
build_dir = ${sysenv.LOCALAPPDATA}/pio_build/tsim7000g_router
default_envs = gateway

[env:gateway]
; ESP-IDF (NOT Arduino): lwIP NAPT is reliable on IDF and broken on the stock
; Arduino core. platform 6.9.x ships ESP-IDF 5.1.x, which has esp_netif_napt_enable()
; and the IDF Component Manager (used to pull espressif/esp_modem). If the toolchain
; ever resolves an older IDF, switch to the pioarduino platform fork (see README).
platform  = espressif32 @ ^6.9.0
board     = esp32dev          ; T-SIM7000G = ESP32-WROVER-B; esp32dev works (PSRAM unused)
framework = espidf

monitor_speed   = 115200
monitor_filters = esp_idf_exception_decoder, time

board_build.partitions = partitions.csv
